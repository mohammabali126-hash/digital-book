        </button>

</div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


const PHONE_PDF =
    "https://mohammabali126-hash.github.io/digital-book/ppt/Phone/phone.pdf";

const PC_PDF =
    "https://mohammabali126-hash.github.io/digital-book/ppt/PC/pc.pdf";


let pdfDocument = null;
let currentPage = 1;
let totalPages = 0;
let currentOrientation = null;
let rendering = false;
let renderAgain = false;


let zoomLevel = 1;

const MIN_ZOOM = 1;
const MAX_ZOOM = 4;
const ZOOM_STEP = 0.25;

let panX = 0;
let panY = 0;

let zoomOriginX = 50;
let zoomOriginY = 50;


/* =========================================================
   MOUSE PAN
   ========================================================= */

let mousePanning = false;

let mouseLastX = 0;
let mouseLastY = 0;


/* =========================================================
   TOUCH
   ========================================================= */

let touchStartX = 0;
let touchStartY = 0;
let touchStartTime = 0;
let touchMoved = false;

let pinchStartDistance = 0;
let pinchStartZoom = 1;

let isPinching = false;


const canvas =
    document.getElementById("pdfCanvas");

const ctx =
    canvas.getContext("2d");

const content =
    document.getElementById("content");

const loading =
    document.getElementById("loading");

const prev =
    document.getElementById("prev");

const next =
    document.getElementById("next");

const progress =
    document.getElementById("progress");

const current =
    document.getElementById("current");

const total =
    document.getElementById("total");

const themeButton =
    document.getElementById("themeButton");

const zoomButton =
    document.getElementById("zoomButton");


function updateViewportSize() {

    const vv =
        window.visualViewport;

    const height =
        vv
            ? vv.height
            : window.innerHeight;

    const width =
        vv
            ? vv.width
            : window.innerWidth;

    document.documentElement
        .style
        .setProperty(
            "--viewport-height",
            height + "px"
        );

    let controlsHeight;

    if (width <= 700) {

        controlsHeight =
            width > height
                ? 48
                : 52;

    } else {

        controlsHeight = 64;
    }

    document.documentElement
        .style
        .setProperty(
            "--controls-height",
            controlsHeight + "px"
        );
}


function getOrientation() {

    return window.innerWidth <
        window.innerHeight
        ? "PHONE"
        : "PC";
}


function resetZoom() {

    zoomLevel = 1;

    panX = 0;
    panY = 0;

    zoomOriginX = 50;
    zoomOriginY = 50;

    mousePanning = false;

    content.style.cursor =
        "default";

    canvas.style.cursor =
        "default";

    applyZoom();

    zoomButton.textContent = "🔍";

    zoomButton.title = "زوم";
}


function applyZoom() {

    canvas.style.transformOrigin =
        `${zoomOriginX}% ${zoomOriginY}%`;

    canvas.style.transform =
        `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
}


function clampPan() {

    if (zoomLevel <= 1) {

        panX = 0;
        panY = 0;

        return;
    }

    const extraX =
        Math.max(
            0,
            (
                canvas.clientWidth * zoomLevel -
                content.clientWidth
            ) / 2
        );

    const extraY =
        Math.max(
            0,
            (
                canvas.clientHeight * zoomLevel -
                content.clientHeight
            ) / 2
        );

    panX =
        Math.max(
            -extraX,
            Math.min(extraX, panX)
        );

    panY =
        Math.max(
            -extraY,
            Math.min(extraY, panY)
        );
}


function zoomAtPoint(
    newZoom,
    clientX,
    clientY
) {

    const oldZoom =
        zoomLevel;

    newZoom =
        Math.max(
            MIN_ZOOM,
            Math.min(MAX_ZOOM, newZoom)
        );

    const rect =
        content.getBoundingClientRect();

    const x =
        clientX - rect.left;

    const y =
        clientY - rect.top;


    /*
     * مختصات نقطه موردنظر نسبت به مرکز
     */

    const centerX =
        rect.width / 2;

    const centerY =
        rect.height / 2;

    const offsetX =
        x - centerX;

    const offsetY =
        y - centerY;


    /*
     * برای اینکه نقطه زیر موس
     * هنگام زوم همانجا باقی بماند،
     * مقدار Pan اصلاح می‌شود.
     */

    panX +=
        offsetX *
        (1 - newZoom / oldZoom);

    panY +=
        offsetY *
        (1 - newZoom / oldZoom);


    zoomOriginX = 50;
    zoomOriginY = 50;

    zoomLevel = newZoom;

    clampPan();

    applyZoom();


    zoomButton.textContent =
        zoomLevel > 1
            ? "↺"
            : "🔍";

    zoomButton.title =
        zoomLevel > 1
            ? "بازگشت به اندازه اصلی"
            : "زوم";

    if (zoomLevel > 1) {

        content.style.cursor =
            "grab";

        canvas.style.cursor =
            "grab";

    } else {

        content.style.cursor =
            "default";

        canvas.style.cursor =
            "default";
    }
}


/* =========================================================
   ZOOM BUTTON
   ========================================================= */

zoomButton.addEventListener(
    "click",
    function() {

        if (zoomLevel > 1) {

            resetZoom();

            return;
        }

        const rect =
            content.getBoundingClientRect();

        zoomAtPoint(
            2,
            rect.left + rect.width / 2,
            rect.top + rect.height / 2
        );
    }
);


/* =========================================================
   MOUSE WHEEL ZOOM
   ========================================================= */

content.addEventListener(
    "wheel",
    function(event) {

        event.preventDefault();

        const direction =
            event.deltaY < 0
                ? 1
                : -1;

        const newZoom =
            zoomLevel +
            direction * ZOOM_STEP;

        zoomAtPoint(
            newZoom,
            event.clientX,
            event.clientY
        );

    },
    {
        passive: false
    }
);


/* =========================================================
   MOUSE LEFT BUTTON PAN
   ========================================================= */

content.addEventListener(
    "mousedown",
    function(event) {

        /*
         * فقط کلیک چپ
         */

        if (event.button !== 0) {
            return;
        }

        /*
         * بدون زوم، Pan نداریم.
         */

        if (zoomLevel <= 1) {
            return;
        }

        mousePanning = true;

        mouseLastX =
            event.clientX;

        mouseLastY =
            event.clientY;

        content.style.cursor =
            "grabbing";

        canvas.style.cursor =
            "grabbing";

        event.preventDefault();
    }
);


window.addEventListener(
    "mousemove",
    function(event) {

        if (!mousePanning) {
            return;
        }

        const dx =
            event.clientX -
            mouseLastX;

        const dy =
            event.clientY -
            mouseLastY;

        panX += dx;
        panY += dy;

        mouseLastX =
            event.clientX;

        mouseLastY =
            event.clientY;

        clampPan();

        applyZoom();

        event.preventDefault();
    }
);


window.addEventListener(
    "mouseup",
    function() {

        if (!mousePanning) {
            return;
        }

        mousePanning = false;

        if (zoomLevel > 1) {

            content.style.cursor =
                "grab";

            canvas.style.cursor =
                "grab";

        } else {

            content.style.cursor =
                "default";

            canvas.style.cursor =
                "default";
        }
    }
);


/* =========================================================
   TOUCH HELPERS
   ========================================================= */

function getTouchDistance(t1, t2) {

    const dx =
        t2.clientX - t1.clientX;

    const dy =
        t2.clientY - t1.clientY;

    return Math.sqrt(
        dx * dx + dy * dy
    );
}


function getTouchCenter(t1, t2) {

    return {
        x: (t1.clientX + t2.clientX) / 2,
        y: (t1.clientY + t2.clientY) / 2
    };
}


/* =========================================================
   TOUCH START
   ========================================================= */

content.addEventListener(
    "touchstart",
    function(event) {

        if (event.touches.length === 2) {

            isPinching = true;

            pinchStartDistance =
                getTouchDistance(
                    event.touches[0],
                    event.touches[1]
                );

            pinchStartZoom =
                zoomLevel;

            return;
        }

        if (event.touches.length === 1) {

            const touch =
                event.touches[0];

            touchStartX =
                touch.clientX;

            touchStartY =
                touch.clientY;

            touchStartTime =
                Date.now();

            touchMoved = false;
        }

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH MOVE
   ========================================================= */

content.addEventListener(
    "touchmove",
    function(event) {

        event.preventDefault();


        if (event.touches.length === 2) {

            isPinching = true;

            const distance =
                getTouchDistance(
                    event.touches[0],
                    event.touches[1]
                );

            const center =
                getTouchCenter(
                    event.touches[0],
                    event.touches[1]
                );

            if (pinchStartDistance > 0) {

                const scale =
                    distance /
                    pinchStartDistance;

                const newZoom =
                    pinchStartZoom *
                    scale;

                zoomAtPoint(
                    newZoom,
                    center.x,
                    center.y
                );
            }

            return;
        }


        if (
            event.touches.length === 1 &&
            zoomLevel > 1
        ) {

            const touch =
                event.touches[0];

            const dx =
                touch.clientX -
                touchStartX;

            const dy =
                touch.clientY -
                touchStartY;

            if (
                Math.abs(dx) > 4 ||
                Math.abs(dy) > 4
            ) {

                touchMoved = true;

                panX += dx;
                panY += dy;

                touchStartX =
                    touch.clientX;

                touchStartY =
                    touch.clientY;

                clampPan();

                applyZoom();
            }
        }

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH END
   ========================================================= */

content.addEventListener(
    "touchend",
    function(event) {

        if (isPinching) {

            if (
                event.touches.length === 0
            ) {

                isPinching = false;
            }

            return;
        }

        if (zoomLevel > 1) {
            return;
        }

        if (
            event.changedTouches.length !== 1
        ) {
            return;
        }

        const touch =
            event.changedTouches[0];

        const dx =
            touch.clientX -
            touchStartX;

        const dy =
            touch.clientY -
            touchStartY;

        const elapsed =
            Date.now() -
            touchStartTime;

        if (
            elapsed < 700 &&
            Math.abs(dx) > 55 &&
            Math.abs(dx) >
                Math.abs(dy) * 1.15
        ) {

            if (dx > 0) {

                showPage(
                    currentPage + 1
                );

            } else {

                showPage(
                    currentPage - 1
                );
            }
        }

    },
    {
        passive: false
    }
);


/* =========================================================
   LOAD PDF
   ========================================================= */

async function loadPDF(
    orientation,
    keepPage = 1
) {

    const url =
        orientation === "PHONE"
            ? PHONE_PDF
            : PC_PDF;

    try {

        loading.style.display = "flex";

        loading.textContent =
            "در حال بارگذاری PDF...";

        pdfDocument = null;

        pdfDocument =
            await pdfjsLib
                .getDocument(url)
                .promise;

        totalPages =
            pdfDocument.numPages;

        total.textContent =
            totalPages;

        progress.min = 1;
        progress.max = totalPages;

        currentPage =
            Math.max(
                1,
                Math.min(
                    keepPage,
                    totalPages
                )
            );

        await showPage(
            currentPage
        );

        currentOrientation =
            orientation;

    } catch (error) {

        loading.style.display =
            "flex";

        loading.textContent =
            "خطا در بارگذاری PDF";

        console.error(error);
    }
}


/* =========================================================
   SHOW PAGE
   ========================================================= */

async function showPage(
    pageNumber
) {

    if (!pdfDocument) {
        return;
    }

    pageNumber =
        Math.max(
            1,
            Math.min(
                pageNumber,
                totalPages
            )
        );

    currentPage =
        pageNumber;

    current.textContent =
        currentPage;

    progress.value =
        currentPage;

    resetZoom();

    if (rendering) {

        renderAgain = true;

        return;
    }

    rendering = true;

    loading.style.display =
        "flex";

    loading.textContent =
        "در حال نمایش صفحه " +
        currentPage +
        "...";

    try {

        const page =
            await pdfDocument.getPage(
                currentPage
            );

        const baseViewport =
            page.getViewport({
                scale: 1
            });

        const availableWidth =
            content.clientWidth - 2;

        const availableHeight =
            content.clientHeight - 2;

        const scaleX =
            availableWidth /
            baseViewport.width;

        const scaleY =
            availableHeight /
            baseViewport.height;

        const scale =
            Math.min(
                scaleX,
                scaleY
            );

        const viewport =
            page.getViewport({
                scale: scale
            });

        const deviceScale =
            window.devicePixelRatio || 1;

        canvas.width =
            Math.floor(
                viewport.width *
                deviceScale
            );

        canvas.height =
            Math.floor(
                viewport.height *
                deviceScale
            );

        canvas.style.width =
            viewport.width + "px";

        canvas.style.height =
            viewport.height + "px";

        ctx.setTransform(
            deviceScale,
            0,
            0,
            deviceScale,
            0,
            0
        );

        await page.render({
            canvasContext: ctx,
            viewport: viewport
        }).promise;

        loading.style.display =
            "none";

    } catch (error) {

        loading.style.display =
            "flex";

        loading.textContent =
            "خطا در نمایش صفحه";

        console.error(error);

    } finally {

        rendering = false;

        if (renderAgain) {

            renderAgain = false;

            showPage(
                currentPage
            );
        }
    }
}


/* =========================================================
   PAGE BUTTONS
   ========================================================= */

prev.addEventListener(
    "click",
    function() {

        showPage(
            currentPage + 1
        );
    }
);

next.addEventListener(
    "click",
    function() {

        showPage(
            currentPage - 1
        );
    }
);


/* =========================================================
   PROGRESS
   ========================================================= */

progress.addEventListener(
    "input",
    function() {

        showPage(
            Number(this.value)
        );
    }
);


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "ArrowRight" ||
            event.key === "ArrowDown"
        ) {

            showPage(
                currentPage + 1
            );
        }

        if (
            event.key === "ArrowLeft" ||
            event.key === "ArrowUp"
        ) {

            showPage(
                currentPage - 1
            );
        }

        if (
            event.key === "Escape" &&
            zoomLevel > 1
        ) {

            resetZoom();
        }
    }
);


/* =========================================================
   DAY / NIGHT
   ========================================================= */

const dayBackground = `
    radial-gradient(
        ellipse 68% 68% at 0% 0%,
        rgba(218, 194, 255, 0.98) 0%,
        rgba(226, 205, 255, 0.84) 24%,
        rgba(239, 228, 255, 0.48) 48%,
        rgba(255, 255, 255, 0) 74%
    ),
    radial-gradient(
        ellipse 72% 72% at 100% 100%,
        rgba(245, 223, 145, 0.98) 0%,
        rgba(248, 228, 158, 0.82) 25%,
        rgba(255, 241, 188, 0.48) 48%,
        rgba(255, 255, 255, 0) 74%
    ),
    radial-gradient(
        ellipse 72% 72% at 50% 50%,
        rgba(255, 255, 255, 0.94) 0%,
        rgba(255, 255, 255, 0.88) 32%,
        rgba(255, 255, 255, 0.48) 58%,
        rgba(255, 255, 255, 0.08) 100%
    )
`;

let nightMode = false;

themeButton.addEventListener(
    "click",
    function() {

        nightMode =
            !nightMode;

        if (nightMode) {

            document.body.style.background = `
                linear-gradient(
                    rgba(0, 0, 0, 0.60),
                    rgba(0, 0, 0, 0.60)
                ),
                ${dayBackground}
            `;

            themeButton.textContent =
                "☾";

        } else {

            document.body.style.background =
                dayBackground;

            themeButton.textContent =
                "☀";
        }
    }
);


/* =========================================================
   ORIENTATION CHANGE
   ========================================================= */

async function handleOrientationChange() {

    updateViewportSize();

    const newOrientation =
        getOrientation();

    if (
        newOrientation !==
        currentOrientation
    ) {

        await loadPDF(
            newOrientation,
            currentPage
        );

    } else {

        if (pdfDocument) {

            await showPage(
                currentPage
            );
        }
    }
}


/* =========================================================
   RESIZE
   ========================================================= */

let resizeTimer = null;

function handleResize() {

    clearTimeout(
        resizeTimer
    );

    resizeTimer =
        setTimeout(
            function() {

                updateViewportSize();

                const orientation =
                    getOrientation();

                if (
                    orientation !==
                    currentOrientation
                ) {

                    handleOrientationChange();

                } else if (
                    pdfDocument
                ) {

                    showPage(
                        currentPage
                    );
                }

            },
            120
        );
}


/* =========================================================
   START
   ========================================================= */

updateViewportSize();

currentOrientation =
    getOrientation();

loadPDF(
    currentOrientation,
    1
);


/* =========================================================
   EVENTS
   ========================================================= */

window.addEventListener(
    "resize",
    handleResize
);

window.addEventListener(
    "orientationchange",
    function() {

        setTimeout(
            handleResize,
            150
        );
    }
);

if (window.visualViewport) {

    window.visualViewport.addEventListener(
        "resize",
        handleResize
    );
}

</script>
