<style>

/* =========================
   BASE
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {

        Arial,
        Tahoma,

        radial-gradient(
            ellipse 68% 68% at 0% 0%,

            rgba(226, 205, 255, 0.84) 24%,

        ),

        );

}


/* =========================
   APP
========================= */

.app {

    width: 100%;
    height: 100vh;

    padding: 10px;

    display: flex;
    flex-direction: column;

    align-items: center;
}


/* =========================
   BOOK
========================= */

.book-wrap {

    flex: 1;

    align-items: center;

}


/* =========================
   LOADING
========================= */

#loading {

    align-items: center;
    justify-content: center;

#loading.hidden {

/* =========================
   CONTROL PANEL
========================= */

.controls {

    margin-top: 14px;

    padding: 11px 15px;

    display: flex;

    align-items: center;

    gap: 10px;

    border-radius: 17px;

    background:
        rgba(255, 255, 255, 0.48);

    border:
        1px solid rgba(255, 255, 255, 0.78);

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    box-shadow:

        0 8px 24px rgba(130, 105, 175, 0.16),

}

        );
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .app {
        padding: 6px;
    }

    .book-wrap {

    }

    }
}


@media (max-width: 420px) {

    .controls {

        gap: 5px;

        padding: 7px;
    }

    }

        min-width: 52px;

    }
}

</style>

</head>


<body>


<div class="app">


    <div class="book-wrap">

        <div class="book">

            <div class="page-inner">

                <canvas id="pdfCanvas"></canvas>

            </div>

            <div id="loading">
                در حال بارگذاری کتاب...
            </div>

        </div>

    </div>


    <div class="controls">

        <button
            id="prevButton"
            class="control-button"
            type="button"
            aria-label="صفحه قبل"
        >
            ‹
        </button>


        <input
            id="progress"
            type="range"
            min="1"
            max="1"
            value="1"
            step="1"
            aria-label="انتخاب صفحه"
        >


        <div
            id="pageCounter"
            class="page-counter"
        >
            1 / 1
        </div>


        <button
            id="nextButton"
            class="control-button"
            type="button"
            aria-label="صفحه بعد"
        >
            ›
        </button>


        <button
            id="themeButton"
            class="control-button"
            type="button"
            aria-label="تغییر حالت"
        >
            ☀
        </button>

    </div>

</div>


<script>

/* =========================================================
   PDF.JS
========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
   PDF PATHS
========================================================= */

const PHONE_PDF =
    "https://mohammabali126-hash.github.io/digital-book/ppt/Phone/phone.pdf";

const PC_PDF =
    "https://mohammabali126-hash.github.io/digital-book/ppt/PC/pc.pdf";


/* =========================================================
   ELEMENTS
========================================================= */

const canvas =
    document.getElementById("pdfCanvas");

const ctx =
    canvas.getContext("2d");

const loading =
    document.getElementById("loading");

const progress =
    document.getElementById("progress");

const pageCounter =
    document.getElementById("pageCounter");

const prevButton =
    document.getElementById("prevButton");

const nextButton =
    document.getElementById("nextButton");

const themeButton =
    document.getElementById("themeButton");


/* =========================================================
   STATE
========================================================= */

let pdfDoc = null;

let currentPage = 1;

let totalPages = 0;

let rendering = false;

let pendingPage = null;

let isLight = true;


/*
    وضعیت فعلی صفحه:

    "PORTRAIT" = عمودی = Phone
    "LANDSCAPE" = افقی = PC
*/

let currentOrientation = null;


/* =========================================================
   GET ORIENTATION
========================================================= */

function getOrientation() {

    if (window.innerWidth >= window.innerHeight) {

        return "LANDSCAPE";

    }

    return "PORTRAIT";
}


/* =========================================================
   GET PDF URL
========================================================= */

function getPDFUrl(orientation) {

    if (orientation === "PORTRAIT") {

        return PHONE_PDF;

    }

    return PC_PDF;
}


/* =========================================================
   LOAD PDF
========================================================= */

async function loadPDF(
    orientation,
    pageToOpen = 1
) {

    const pdfURL =
        getPDFUrl(orientation);


    try {

        loading.classList.remove("hidden");

        loading.textContent =
            "در حال بارگذاری کتاب...";


        /*
            هنگام تعویض فایل، رندر قبلی را متوقف می‌کنیم.
        */

        rendering = false;

        pendingPage = null;


        const loadingTask =
            pdfjsLib.getDocument(pdfURL);


        const newPdfDoc =
            await loadingTask.promise;


        /*
            فایل جدید با موفقیت لود شده.
        */

        pdfDoc =
            newPdfDoc;


        totalPages =
            pdfDoc.numPages;


        /*
            اگر شماره صفحه در فایل جدید وجود نداشته باشد،
            به آخرین صفحه موجود می‌رویم.
        */

        currentPage =
            Math.min(
                Math.max(1, pageToOpen),
                totalPages
            );


        progress.min = 1;

        progress.max = totalPages;

        progress.value = currentPage;


        updateControls();


        /*
            همان شماره صفحه قبلی را باز می‌کنیم.
        */

        await showPage(currentPage);


        currentOrientation =
            orientation;


        loading.classList.add("hidden");


    } catch (error) {

        console.error(
            "PDF loading error:",
            error
        );

        loading.textContent =
            "خطا در بارگذاری فایل PDF";
    }
}


/* =========================================================
   SHOW PAGE
========================================================= */

async function showPage(pageNumber) {

    if (!pdfDoc) return;


    if (rendering) {

        pendingPage =
            pageNumber;

        return;
    }


    rendering = true;


    try {

        const page =
            await pdfDoc.getPage(pageNumber);


        const container =
            document.querySelector(".page-inner");


        const containerWidth =
            container.clientWidth;


        const containerHeight =
            container.clientHeight;


        const viewport =
            page.getViewport({
                scale: 1
            });


        const scaleX =
            containerWidth /
            viewport.width;


        const scaleY =
            containerHeight /
            viewport.height;


        let scale =
            Math.min(
                scaleX,
                scaleY
            );


        scale *= 0.97;


        const devicePixelRatio =
            window.devicePixelRatio || 1;


        const renderViewport =
            page.getViewport({
                scale: scale
            });


        canvas.width =
            Math.floor(
                renderViewport.width *
                devicePixelRatio
            );


        canvas.height =
            Math.floor(
                renderViewport.height *
                devicePixelRatio
            );


        canvas.style.width =
            Math.floor(
                renderViewport.width
            ) + "px";


        canvas.style.height =
            Math.floor(
                renderViewport.height
            ) + "px";


        ctx.setTransform(
            devicePixelRatio,
            0,
            0,
            devicePixelRatio,
            0,
            0
        );


        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        await page.render({

            canvasContext: ctx,

            viewport:
                renderViewport

        }).promise;


        currentPage =
            pageNumber;


        progress.value =
            currentPage;


        updateControls();


    } catch (error) {

        console.error(
            "PDF render error:",
            error
        );


    } finally {

        rendering = false;


        if (
            pendingPage !== null
        ) {

            const nextPage =
                pendingPage;


            pendingPage =
                null;


            showPage(
                nextPage
            );
        }
    }
}


/* =========================================================
   CONTROLS
========================================================= */

function updateControls() {

    pageCounter.textContent =
        currentPage +
        " / " +
        totalPages;


    prevButton.disabled =
        currentPage <= 1;


    nextButton.disabled =
        currentPage >= totalPages;


    progress.value =
        currentPage;
}


/* =========================================================
   PREVIOUS
========================================================= */

prevButton.addEventListener(
    "click",
    function () {

        if (
            currentPage > 1
        ) {

            showPage(
                currentPage - 1
            );
        }
    }
);


/* =========================================================
   NEXT
========================================================= */

nextButton.addEventListener(
    "click",
    function () {

        if (
            currentPage < totalPages
        ) {

            showPage(
                currentPage + 1
            );
        }
    }
);


/* =========================================================
   SLIDER
========================================================= */

progress.addEventListener(
    "input",
    function () {

        const pageNumber =
            Number(
                progress.value
            );


        pageCounter.textContent =
            pageNumber +
            " / " +
            totalPages;
    }
);


progress.addEventListener(
    "change",
    function () {

        const pageNumber =
            Number(
                progress.value
            );


        showPage(
            pageNumber
        );
    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "ArrowLeft" ||
            event.key === "ArrowUp"
        ) {

            if (
                currentPage > 1
            ) {

                showPage(
                    currentPage - 1
                );
            }
        }


        if (
            event.key === "ArrowRight" ||
            event.key === "ArrowDown"
        ) {

            if (
                currentPage < totalPages
            ) {

                showPage(
                    currentPage + 1
                );
            }
        }
    }
);


/* =========================================================
   TOUCH SWIPE
========================================================= */

let touchStartX = 0;

let touchEndX = 0;


canvas.addEventListener(
    "touchstart",
    function (event) {

        if (
            event.touches.length !== 1
        ) return;


        touchStartX =
            event.touches[0].clientX;

    },
    {
        passive: true
    }
);


canvas.addEventListener(
    "touchend",
    function (event) {

        if (
            event.changedTouches.length !== 1
        ) return;


        touchEndX =
            event.changedTouches[0].clientX;


        handleSwipe();

    },
    {
        passive: true
    }
);


function handleSwipe() {

    const difference =
        touchEndX -
        touchStartX;


    const minimumSwipe =
        50;


    if (
        Math.abs(difference) <
        minimumSwipe
    ) return;


    if (
        difference > 0
    ) {

        if (
            currentPage < totalPages
        ) {

            showPage(
                currentPage + 1
            );
        }

    } else {

        if (
            currentPage > 1
        ) {

            showPage(
                currentPage - 1
            );
        }
    }
}


/* =========================================================
   THEME
========================================================= */

themeButton.addEventListener(
    "click",
    function () {

        isLight =
            !isLight;


        if (isLight) {

            document.body.style.background =
                `
                radial-gradient(
                    ellipse 68% 68% at 0% 0%,
                    rgba(218, 194, 255, 0.98) 0%,
                    rgba(226, 205, 255, 0.84) 24%,
                    rgba(239, 228, 255, 0.48) 48%,
                    rgba(255, 255, 255, 0) 74%
                ),

                radial-gradient(
                    ellipse 72% 72% at 100% 100%,
                    rgba(245, 223, 145, 0.98) 0%,
                    rgba(248, 228, 158, 0.82) 25%,
                    rgba(255, 241, 188, 0.48) 48%,
                    rgba(255, 255, 255, 0) 74%
                ),

                radial-gradient(
                    ellipse 72% 72% at 50% 50%,
                    rgba(255, 255, 255, 0.94) 0%,
                    rgba(255, 255, 255, 0.88) 32%,
                    rgba(255, 255, 255, 0.48) 58%,
                    rgba(255, 255, 255, 0.08) 100%
                )
                `;


            themeButton.textContent =
                "☀";


        } else {

            document.body.style.background =
                `
                linear-gradient(
                    rgba(0, 0, 0, 0.60),
                    rgba(0, 0, 0, 0.60)
                ),

                radial-gradient(
                    ellipse 68% 68% at 0% 0%,
                    rgba(218, 194, 255, 0.98) 0%,
                    rgba(226, 205, 255, 0.84) 24%,
                    rgba(239, 228, 255, 0.48) 48%,
                    rgba(255, 255, 255, 0) 74%
                ),

                radial-gradient(
                    ellipse 72% 72% at 100% 100%,
                    rgba(245, 223, 145, 0.98) 0%,
                    rgba(248, 228, 158, 0.82) 25%,
                    rgba(255, 241, 188, 0.48) 48%,
                    rgba(255, 255, 255, 0) 74%
                ),

                radial-gradient(
                    ellipse 72% 72% at 50% 50%,
                    rgba(255, 255, 255, 0.94) 0%,
                    rgba(255, 255, 255, 0.88) 32%,
                    rgba(255, 255, 255, 0.48) 58%,
                    rgba(255, 255, 255, 0.08) 100%
                )
                `;


            themeButton.textContent =
                "🌙";
        }
    }
);


/* =========================================================
   AUTOMATIC ORIENTATION DETECTION
========================================================= */

let orientationTimer = null;


function checkOrientation() {

    const newOrientation =
        getOrientation();


    /*
        اگر اولین بار است،
        PDF مناسب را باز کن.
    */

    if (
        currentOrientation === null
    ) {

        loadPDF(
            newOrientation,
            currentPage
        );

        return;
    }


    /*
        اگر جهت صفحه واقعاً عوض نشده،
        فقط اندازه PDF را دوباره تنظیم کن.
    */

    if (
        newOrientation ===
        currentOrientation
    ) {

        if (pdfDoc) {

            showPage(
                currentPage
            );
        }

        return;
    }


    /*
        اینجا جهت واقعاً عوض شده است.

        مهم:
        شماره صفحه فعلی را نگه می‌داریم.
    */

    const pageToKeep =
        currentPage;


    currentOrientation =
        newOrientation;


    /*
        فایل جدید را باز می‌کنیم
        و همان صفحه قبلی را نمایش می‌دهیم.
    */

    loadPDF(
        newOrientation,
        pageToKeep
    );
}


/* =========================================================
   RESIZE / ROTATION
========================================================= */

window.addEventListener(
    "resize",
    function () {

        clearTimeout(
            orientationTimer
        );


        orientationTimer =
            setTimeout(
                function () {

                    checkOrientation();

                },
                250
            );
    }
);


/*
    بعضی موبایل‌ها رویداد orientationchange
    را بهتر از resize گزارش می‌کنند.
*/

window.addEventListener(
    "orientationchange",
    function () {

        clearTimeout(
            orientationTimer
        );


        orientationTimer =
            setTimeout(
                function () {

                    checkOrientation();

                },
                350
            );
    }
);


/* =========================================================
   START
========================================================= */

checkOrientation();

</script>

</body>

</html>
