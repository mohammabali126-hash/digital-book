<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Book</title>

  <style>
    :root{
      --purple:#7c3aed;
      --violet:#a855f7;
      --yellow:#6303b2;
      --background:#090714;
      --panel:rgba(255,255,255,.10);
      --border:rgba(255,255,255,.22);
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html,
    body{
      width:100%;
      height:100%;
    }

    body{
      font-family:Arial, Tahoma, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(124,58,237,.28), transparent 35%),
        radial-gradient(circle at 80% 90%, rgba(168,85,247,.20), transparent 35%),
        linear-gradient(135deg,#090714,#120b24,#090714);
      color:white;
      overflow:hidden;
    }

    #app{
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:18px;
      padding:12px;
    }

    .book-wrap{
      width:min(1250px,99vw);
      height:min(78vh,760px);
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .book{
      width:100%;
      height:100%;
      background:#fff;
      border:1px solid rgba(255,255,255,.35);
      border-radius:10px;
      overflow:hidden;
      box-shadow:
        0 25px 70px rgba(0,0,0,.55),
        0 0 35px rgba(124,58,237,.18);
      position:relative;
    }

    .page{
      width:100%;
      height:100%;
      background:white;
      overflow:hidden;
    }

    .page-inner{
      width:100%;
      height:100%;
      padding:1px;
      overflow:hidden;
      background:white;
    }

    #content{
      width:100%;
      height:100%;
      overflow:hidden;
      position:relative;
      background:white;
    }

    .pdf-frame{
      width:100%;
      height:100%;
      border:0;
      display:block;
      background:white;
    }

    .controls{
      width:min(700px,95vw);
      min-height:62px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:18px;
      padding:10px 16px;
      border:1px solid var(--border);
      border-radius:18px;
      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.13),
          rgba(255,255,255,.06)
        );
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      box-shadow:0 12px 40px rgba(0,0,0,.35);
    }

    .nav{
      width:44px;
      height:44px;
      border:1px solid rgba(255,255,255,.25);
      border-radius:12px;
      background:rgba(255,255,255,.10);
      color:white;
      font-size:34px;
      line-height:1;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:.2s;
      user-select:none;
    }

    .nav:hover{
      background:rgba(255,255,255,.18);
      transform:scale(1.05);
    }

    .nav:active{
      transform:scale(.96);
    }

    .progress-box{
      flex:1;
      max-width:500px;
      display:flex;
      align-items:center;
      gap:14px;
    }

    #progress{
      flex:1;
      accent-color:var(--violet);
      cursor:pointer;
    }

    .counter{
      min-width:70px;
      text-align:center;
      font-size:14px;
      color:rgba(255,255,255,.9);
      direction:ltr;
      white-space:nowrap;
    }

    .page-loading{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:white;
      color:#333;
      font-size:15px;
      z-index:2;
    }

    @media(max-width:700px){

      #app{
        gap:10px;
        padding:6px;
      }

      .book-wrap{
        width:100%;
        height:calc(100vh - 90px);
      }

      .book{
        border-radius:7px;
      }

      .controls{
        width:96vw;
        min-height:54px;
        gap:10px;
        padding:7px 10px;
        border-radius:14px;
      }

      .nav{
        width:38px;
        height:38px;
        font-size:29px;
      }

      .progress-box{
        gap:8px;
      }

      .counter{
        min-width:52px;
        font-size:12px;
      }
    }
  </style>
</head>

<body>

  <div id="app">

    <div class="book-wrap">
      <div id="book" class="book">

        <div id="page" class="page">

          <div class="page-inner">

            <div id="content">
              <div class="page-loading">
                در حال بارگذاری...
              </div>
            </div>

          </div>

        </div>

      </div>
    </div>

    <div class="controls">

      <button
        class="nav"
        id="prev"
        aria-label="صفحه قبل">
        ‹
      </button>

      <div class="progress-box">

        <input
          id="progress"
          type="range"
          min="1"
          max="30"
          value="1"
          step="1"
          aria-label="شماره صفحه">

        <div class="counter">
          <span id="current">1</span>
          /
          <span id="total">30</span>
        </div>

      </div>

      <button
        class="nav"
        id="next"
        aria-label="صفحه بعد">
        ›
      </button>

    </div>

  </div>


  <script>

    const TOTAL_PAGES = 30;

    const PDF_URL =
      "https://mohammabali126-hash.github.io/digital-book/ppt/PC/pc.pdf";


    let currentPage = 1;


    const content =
      document.getElementById("content");

    const prev =
      document.getElementById("prev");

    const next =
      document.getElementById("next");

    const progress =
      document.getElementById("progress");

    const current =
      document.getElementById("current");

    const total =
      document.getElementById("total");


    total.textContent = TOTAL_PAGES;


    function createPDFFrame(pageNumber){

      const frame =
        document.createElement("iframe");

      frame.className = "pdf-frame";

      frame.allowFullscreen = true;

      frame.loading = "eager";

      /*
        page= شماره صفحه PDF
        zoom=page-fit باعث می‌شود
        صفحه تا حد ممکن داخل قاب جا شود.
      */

      frame.src =
        PDF_URL +
        "#page=" +
        pageNumber +
        "&zoom=page-fit";

      return frame;
    }


    function renderPage(pageNumber){

      content.innerHTML = "";

      const loading =
        document.createElement("div");

      loading.className =
        "page-loading";

      loading.textContent =
        "در حال بارگذاری صفحه " +
        pageNumber +
        "...";

      content.appendChild(loading);


      const frame =
        createPDFFrame(pageNumber);


      frame.addEventListener(
        "load",
        function(){

          setTimeout(function(){

            if(loading.parentNode){
              loading.remove();
            }

          },300);

        }
      );


      content.appendChild(frame);
    }


    function showPage(pageNumber){

      if(pageNumber < 1){
        pageNumber = 1;
      }

      if(pageNumber > TOTAL_PAGES){
        pageNumber = TOTAL_PAGES;
      }

      currentPage = pageNumber;

      current.textContent =
        currentPage;

      progress.value =
        currentPage;

      prev.disabled =
        currentPage === 1;

      next.disabled =
        currentPage === TOTAL_PAGES;


      renderPage(currentPage);
    }


    prev.addEventListener(
      "click",
      function(){
        showPage(currentPage - 1);
      }
    );


    next.addEventListener(
      "click",
      function(){
        showPage(currentPage + 1);
      }
    );


    progress.addEventListener(
      "input",
      function(){
        showPage(Number(this.value));
      }
    );


    document.addEventListener(
      "keydown",
      function(event){

        if(
          event.key === "ArrowLeft" ||
          event.key === "ArrowUp"
        ){
          showPage(currentPage - 1);
        }

        if(
          event.key === "ArrowRight" ||
          event.key === "ArrowDown"
        ){
          showPage(currentPage + 1);
        }

      }
    );


    let touchStartX = 0;
    let touchEndX = 0;


    content.addEventListener(
      "touchstart",
      function(event){

        touchStartX =
          event.changedTouches[0].screenX;

      },
      {passive:true}
    );


    content.addEventListener(
      "touchend",
      function(event){

        touchEndX =
          event.changedTouches[0].screenX;

        const difference =
          touchEndX - touchStartX;


        if(Math.abs(difference) < 50){
          return;
        }


        /*
          در حالت RTL:
          کشیدن به چپ → صفحه بعد
          کشیدن به راست → صفحه قبل
        */

        if(difference < 0){
          showPage(currentPage + 1);
        }
        else{
          showPage(currentPage - 1);
        }

      },
      {passive:true}
    );


    window.addEventListener(
      "resize",
      function(){
        /*
          PDF viewer خودش اندازه صفحه
          را با قاب هماهنگ می‌کند.
        */
      }
    );


    showPage(1);

  </script>

</body>
</html>
