<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Book</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>

        /* =========================================================
           COLOR SYSTEM
        ========================================================= */

        :root {
            --purple: #d9c2ff;
            --purple-light: #eee4ff;

            --yellow: #f5df91;
            --yellow-light: #fff1b8;

            --white: #ffffff;

            --glass: rgba(255, 255, 255, 0.32);
            --glass-border: rgba(255, 255, 255, 0.55);

            --text-main: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.90);
        }


        /* =========================================================
           GLOBAL
        ========================================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {

            font-family: Arial, Tahoma, sans-serif;

            color: var(--text-main);

            /*
               پس‌زمینه اصلی:

               بالا چپ  = یاسی روشن
               مرکز     = سفید
               پایین راست = زرد نیمه روشن

               گرادیان‌ها کاملاً نرم هستند و
               مرز مشخصی بین رنگ‌ها وجود ندارد.
            */

            background:

                radial-gradient(
                    ellipse 65% 65% at 0% 0%,
                    rgba(218, 194, 255, 0.95) 0%,
                    rgba(228, 209, 255, 0.78) 24%,
                    rgba(239, 228, 255, 0.42) 48%,
                    rgba(255, 255, 255, 0) 72%
                ),

                radial-gradient(
                    ellipse 70% 70% at 100% 100%,
                    rgba(245, 223, 145, 0.95) 0%,
                    rgba(248, 229, 163, 0.78) 25%,
                    rgba(255, 242, 191, 0.42) 48%,
                    rgba(255, 255, 255, 0) 72%
                ),

                radial-gradient(
                    ellipse 75% 75% at 50% 50%,
                    rgba(255, 255, 255, 1) 0%,
                    rgba(255, 255, 255, 0.98) 35%,
                    rgba(255, 255, 255, 0.65) 58%,
                    rgba(255, 255, 255, 0.15) 100%
                );

            transition:
                background 0.35s ease,
                color 0.35s ease;
        }


        /* =========================================================
           MAIN APP
        ========================================================= */

        .app {

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            padding: 10px;
        }


        /* =========================================================
           BOOK WRAPPER
        ========================================================= */

        .book-wrap {

            width: min(1250px, 99vw);

            height: min(78vh, 760px);

            display: flex;

            align-items: center;
            justify-content: center;
        }


        /* =========================================================
           BOOK
        ========================================================= */

        .book {

            width: 100%;
            height: 100%;

            background: #ffffff;

            border-radius: 18px;

            overflow: hidden;

            position: relative;

            box-shadow:
                0 0 35px rgba(160, 130, 210, 0.16),
                0 20px 70px rgba(100, 80, 130, 0.16);
        }


        /* =========================================================
           PAGE
        ========================================================= */

        .page-inner {

            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #ffffff;

            overflow: hidden;
        }

        #pdfCanvas {

            display: block;

            max-width: 100%;
            max-height: 100%;

            background: #ffffff;
        }


        /* =========================================================
           LOADING
        ========================================================= */

        #loading {

            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            background: rgba(255, 255, 255, 0.92);

            color: #8065a8;

            font-size: 18px;

            z-index: 10;
        }

        #loading.hidden {
            display: none;
        }


        /* =========================================================
           CONTROL PANEL
        ========================================================= */

        .controls {

            width: min(1250px, 99vw);

            margin-top: 14px;

            padding: 10px 14px;

            display: flex;

            align-items: center;

            gap: 10px;

            border-radius: 16px;

            /*
               شیشه روشن؛
               بدون سیاه کردن پس‌زمینه
            */

            background: rgba(255, 255, 255, 0.32);

            border: 1px solid rgba(255, 255, 255, 0.60);

            backdrop-filter: blur(20px);

            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 12px 35px rgba(100, 80, 130, 0.12);
        }


        /* =========================================================
           BUTTONS
        ========================================================= */

        .control-button {

            width: 42px;
            height: 38px;

            flex-shrink: 0;

            border-radius: 10px;

            cursor: pointer;

            font-size: 17px;

            border: 1px solid rgba(255, 255, 255, 0.60);

            background: rgba(255, 255, 255, 0.32);

            color: #ffffff;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.2s ease;
        }

        .control-button:hover {

            background: rgba(255, 255, 255, 0.52);

            border-color: rgba(255, 255, 255, 0.82);

            box-shadow:
                0 0 18px rgba(180, 150, 230, 0.22);

            transform: translateY(-1px);
        }

        .control-button:active {
            transform: translateY(0);
        }

        .control-button:disabled {

            opacity: 0.35;

            cursor: default;

            box-shadow: none;

            transform: none;
        }


        /* =========================================================
           PROGRESS
        ========================================================= */

        #progress {

            flex: 1;

            min-width: 50px;

            height: 5px;

            accent-color: #ffffff;

            cursor: pointer;
        }


        /* =========================================================
           PAGE COUNTER
        ========================================================= */

        .page-counter {

            min-width: 65px;

            text-align: center;

            font-size: 14px;

            color: rgba(255, 255, 255, 0.90);

            direction: ltr;

            white-space: nowrap;
        }


        /* =========================================================
           THEME BUTTON
        ========================================================= */

        #themeButton {

            color: #ffffff;

            border-color: rgba(255, 255, 255, 0.60);
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 700px) {

            .app {
                padding: 6px;
            }

            .book-wrap {

                width: 100%;

                height: min(76vh, 720px);
            }

            .book {
                border-radius: 14px;
            }

            .controls {

                width: 100%;

                margin-top: 10px;

                padding: 8px 9px;

                gap: 7px;

                border-radius: 14px;
            }

            .control-button {

                width: 40px;
                height: 36px;

                font-size: 16px;
            }

            .page-counter {

                min-width: 58px;

                font-size: 13px;
            }

            #progress {
                min-width: 40px;
            }
        }


        /* =========================================================
           VERY SMALL SCREENS
        ========================================================= */

        @media (max-width: 420px) {

            .controls {

                gap: 5px;

                padding: 7px;
            }

            .control-button {

                width: 36px;
                height: 34px;

                font-size: 15px;
            }

            .page-counter {

                min-width: 52px;

                font-size: 12px;
            }
        }

    </style>
</head>


<body>

    <div class="app">

        <!-- =====================================================
             BOOK
        ====================================================== -->

        <div class="book-wrap">

            <div class="book">

                <div class="page-inner">

                    <canvas id="pdfCanvas"></canvas>

                </div>

                <div id="loading">
                    در حال بارگذاری کتاب...
                </div>

            </div>

        </div>


        <!-- =====================================================
             CONTROLS
        ====================================================== -->

        <div class="controls">

            <button
                id="prevButton"
                class="control-button"
                type="button"
                aria-label="صفحه قبل">
                ‹
            </button>


            <input
                id="progress"
                type="range"
                min="1"
                max="1"
                value="1"
                step="1"
                aria-label="انتخاب صفحه">


            <div
                id="pageCounter"
                class="page-counter">
                1 / 1
            </div>


            <button
                id="nextButton"
                class="control-button"
                type="button"
                aria-label="صفحه بعد">
                ›
            </button>


            <button
                id="themeButton"
                class="control-button"
                type="button"
                aria-label="تغییر حالت">
                ☀
            </button>

        </div>

    </div>


    <script>

        /* =========================================================
           SETTINGS
        ========================================================= */

        const BOOK_TYPE = "PC";


        /* =========================================================
           PDF URL
        ========================================================= */

        const PDF_URL =
            BOOK_TYPE === "PHONE"
                ? "https://mohammabali126-hash.github.io/digital-book/ppt/Phone/phone.pdf"
                : "https://mohammabali126-hash.github.io/digital-book/ppt/PC/pc.pdf";


        /* =========================================================
           PDF.JS WORKER
        ========================================================= */

        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


        /* =========================================================
           ELEMENTS
        ========================================================= */

        const canvas =
            document.getElementById("pdfCanvas");

        const ctx =
            canvas.getContext("2d");

        const loading =
            document.getElementById("loading");

        const progress =
            document.getElementById("progress");

        const pageCounter =
            document.getElementById("pageCounter");

        const prevButton =
            document.getElementById("prevButton");

        const nextButton =
            document.getElementById("nextButton");

        const themeButton =
            document.getElementById("themeButton");


        /* =========================================================
           VARIABLES
        ========================================================= */

        let pdfDoc = null;

        let currentPage = 1;

        let totalPages = 0;

        let rendering = false;

        let pendingPage = null;

        let isLight = true;


        /* =========================================================
           LOAD PDF
        ========================================================= */

        async function loadPDF() {

            try {

                loading.classList.remove("hidden");

                const loadingTask =
                    pdfjsLib.getDocument(PDF_URL);

                pdfDoc =
                    await loadingTask.promise;

                totalPages =
                    pdfDoc.numPages;

                progress.max =
                    totalPages;

                progress.value =
                    currentPage;

                updateControls();

                await showPage(currentPage);

                loading.classList.add("hidden");

            } catch (error) {

                console.error(error);

                loading.textContent =
                    "خطا در بارگذاری فایل PDF";
            }
        }


        /* =========================================================
           SHOW PAGE
        ========================================================= */

        async function showPage(pageNumber) {

            if (!pdfDoc) {
                return;
            }

            if (rendering) {

                pendingPage =
                    pageNumber;

                return;
            }

            rendering = true;

            try {

                const page =
                    await pdfDoc.getPage(pageNumber);

                const container =
                    document.querySelector(".page-inner");

                const containerWidth =
                    container.clientWidth;

                const containerHeight =
                    container.clientHeight;

                const viewport =
                    page.getViewport({
                        scale: 1
                    });

                const scaleX =
                    containerWidth / viewport.width;

                const scaleY =
                    containerHeight / viewport.height;

                let scale =
                    Math.min(scaleX, scaleY);

                scale *= 0.97;

                const devicePixelRatio =
                    window.devicePixelRatio || 1;

                const renderViewport =
                    page.getViewport({
                        scale: scale
                    });

                canvas.width =
                    Math.floor(
                        renderViewport.width *
                        devicePixelRatio
                    );

                canvas.height =
                    Math.floor(
                        renderViewport.height *
                        devicePixelRatio
                    );

                canvas.style.width =
                    Math.floor(
                        renderViewport.width
                    ) + "px";

                canvas.style.height =
                    Math.floor(
                        renderViewport.height
                    ) + "px";

                ctx.setTransform(
                    devicePixelRatio,
                    0,
                    0,
                    devicePixelRatio,
                    0,
                    0
                );

                ctx.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                await page.render({
                    canvasContext: ctx,
                    viewport: renderViewport
                }).promise;

                currentPage =
                    pageNumber;

                progress.value =
                    currentPage;

                updateControls();

            } catch (error) {

                console.error(
                    "PDF render error:",
                    error
                );

            } finally {

                rendering = false;

                if (pendingPage !== null) {

                    const nextPage =
                        pendingPage;

                    pendingPage = null;

                    showPage(nextPage);
                }
            }
        }


        /* =========================================================
           UPDATE CONTROLS
        ========================================================= */

        function updateControls() {

            pageCounter.textContent =
                currentPage + " / " + totalPages;

            prevButton.disabled =
                currentPage <= 1;

            nextButton.disabled =
                currentPage >= totalPages;

            progress.value =
                currentPage;
        }


        /* =========================================================
           PREVIOUS
        ========================================================= */

        prevButton.addEventListener(
            "click",
            function () {

                if (currentPage > 1) {

                    showPage(
                        currentPage - 1
                    );
                }
            }
        );


        /* =========================================================
           NEXT
        ========================================================= */

        nextButton.addEventListener(
            "click",
            function () {

                if (currentPage < totalPages) {

                    showPage(
                        currentPage + 1
                    );
                }
            }
        );


        /* =========================================================
           SLIDER
        ========================================================= */

        progress.addEventListener(
            "input",
            function () {

                const pageNumber =
                    Number(progress.value);

                pageCounter.textContent =
                    pageNumber + " / " + totalPages;
            }
        );


        progress.addEventListener(
            "change",
            function () {

                const pageNumber =
                    Number(progress.value);

                showPage(pageNumber);
            }
        );


        /* =========================================================
           KEYBOARD
        ========================================================= */

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "ArrowLeft" ||
                    event.key === "ArrowUp"
                ) {

                    if (currentPage > 1) {

                        showPage(
                            currentPage - 1
                        );
                    }
                }

                if (
                    event.key === "ArrowRight" ||
                    event.key === "ArrowDown"
                ) {

                    if (currentPage < totalPages) {

                        showPage(
                            currentPage + 1
                        );
                    }
                }
            }
        );


        /* =========================================================
           TOUCH / SWIPE
        ========================================================= */

        let touchStartX = 0;

        let touchEndX = 0;


        canvas.addEventListener(
            "touchstart",
            function (event) {

                if (event.touches.length !== 1) {
                    return;
                }

                touchStartX =
                    event.touches[0].clientX;

            },
            {
                passive: true
            }
        );


        canvas.addEventListener(
            "touchend",
            function (event) {

                if (event.changedTouches.length !== 1) {
                    return;
                }

                touchEndX =
                    event.changedTouches[0].clientX;

                handleSwipe();

            },
            {
                passive: true
            }
        );


        function handleSwipe() {

            const difference =
                touchEndX - touchStartX;

            const minimumSwipe =
                50;

            if (
                Math.abs(difference) <
                minimumSwipe
            ) {
                return;
            }

            if (difference > 0) {

                if (currentPage < totalPages) {

                    showPage(
                        currentPage + 1
                    );
                }

            } else {

                if (currentPage > 1) {

                    showPage(
                        currentPage - 1
                    );
                }
            }
        }


        /* =========================================================
           THEME BUTTON
        ========================================================= */

        themeButton.addEventListener(
            "click",
            function () {

                isLight =
                    !isLight;

                if (isLight) {

                    document.body.style.background =
                        `
                        radial-gradient(
                            ellipse 65% 65% at 0% 0%,
                            rgba(218, 194, 255, 0.95) 0%,
                            rgba(228, 209, 255, 0.78) 24%,
                            rgba(239, 228, 255, 0.42) 48%,
                            rgba(255, 255, 255, 0) 72%
                        ),

                        radial-gradient(
                            ellipse 70% 70% at 100% 100%,
                            rgba(245, 223, 145, 0.95) 0%,
                            rgba(248, 229, 163, 0.78) 25%,
                            rgba(255, 242, 191, 0.42) 48%,
                            rgba(255, 255, 255, 0) 72%
                        ),

                        radial-gradient(
                            ellipse 75% 75% at 50% 50%,
                            rgba(255, 255, 255, 1) 0%,
                            rgba(255, 255, 255, 0.98) 35%,
                            rgba(255, 255, 255, 0.65) 58%,
                            rgba(255, 255, 255, 0.15) 100%
                        )
                        `;

                    themeButton.textContent = "☀";

                } else {

                    /*
                       حالت دوم همچنان روشن و نرم است.
                       هیچ لایه مشکی روی صفحه قرار نمی‌گیرد.
                    */

                    document.body.style.background =
                        `
                        radial-gradient(
                            ellipse 65% 65% at 0% 0%,
                            rgba(195, 166, 245, 0.85) 0%,
                            rgba(218, 198, 250, 0.65) 28%,
                            rgba(245, 238, 250, 0.25) 60%,
                            transparent 78%
                        ),

                        radial-gradient(
                            ellipse 70% 70% at 100% 100%,
                            rgba(239, 211, 126, 0.85) 0%,
                            rgba(247, 226, 158, 0.60) 30%,
                            rgba(255, 242, 190, 0.22) 60%,
                            transparent 80%
                        ),

                        radial-gradient(
                            ellipse 75% 75% at 50% 50%,
                            #ffffff 0%,
                            rgba(255, 255, 255, 0.96) 38%,
                            rgba(250, 247, 255, 0.60) 70%,
                            rgba(255, 255, 255, 0.20) 100%
                        )
                        `;

                    themeButton.textContent = "🌙";
                }
            }
        );


        /* =========================================================
           RESIZE
        ========================================================= */

        let resizeTimer = null;


        window.addEventListener(
            "resize",
            function () {

                clearTimeout(resizeTimer);

                resizeTimer =
                    setTimeout(
                        function () {

                            if (pdfDoc) {

                                showPage(
                                    currentPage
                                );
                            }

                        },
                        150
                    );
            }
        );


        /* =========================================================
           START
        ========================================================= */

        loadPDF();

    </script>

</body>

</html>
