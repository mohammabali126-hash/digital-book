<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Digital Book</title>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>

/* =========================================================
   COLORS
   ========================================================= */

:root {

  /* حالت روز - بنفش و لیمویی */
  --bg-main: #FCE456;
  --bg-secondary: #b178eb;

  --purple: #f6e587;
  --purple-light:#7b744d;

  --lime: #DCC6F5;
  --lime-light: #8e559d;

  --glass: rgba(255,255,255,0.08);
  --glass-border: rgba(255,255,255,0.14);

  --text-main: #ffffff;
  --text-secondary: #d9cfee;

  --shadow-purple:
    0 0 35px rgba(255, 255, 255, 0);

  --shadow-lime:
    0 0 25px rgba(74, 178, 243, 0.18);
}


/* =========================================================
   BODY
   ========================================================= */

* {
  box-sizing: border-box;
}

html,
body {

  width: 100%;
  height: 100%;

  margin: 0;
  padding: 0;

  overflow: hidden;
}

body {

  font-family:
    Arial,
    Tahoma,
    sans-serif;

  color: var(--text-main);
background: var(--bg-main);
  transition:
    background 0.35s ease,
    color 0.35s ease;
}


/* =========================================================
   LIGHT / DAY MODE
   ========================================================= */

body.light {

  --bg-main: #bf8fe9;
  --bg-secondary: #ffff59;

  --purple: #ad8de3;
  --purple-light: #5d4475;

  --lime: #f1fe8b;
  --lime-light: #c9c475;

  --glass: rgba(255,255,255,0.10);
  --glass-border: rgba(255,255,255,0.18);

  --text-main: #ffffff;
  --text-secondary: #eadfff;

  background:

    radial-gradient(
      circle at 15% 15%,
      #8a14f890,
      transparent 38%
    ),

    radial-gradient(
      circle at 85% 85%,
      rgba(255, 255, 20, 0.822),
      transparent 35%
    ),

    linear-gradient(
      135deg,
      #160621,
      #32114b
    );
}


/* =========================================================
   NIGHT MODE
   ========================================================= */

body:not(.light) {

  --bg-main: #030107;
  --bg-secondary: #08030d;

  --purple: #54208f;
  --purple-light: #7437a8;

  --lime: #6d8f2b;
  --lime-light: #8eaf42;

  --glass: rgba(255,255,255,0.045);
  --glass-border: rgba(255,255,255,0.08);

  --text-main: #eeeeee;
  --text-secondary: #aaa0b5;

  background:

    radial-gradient(
      circle at 15% 15%,
      rgba(84,32,143,0.22),
      transparent 35%
    ),

    radial-gradient(
      circle at 85% 85%,
      rgba(109,143,43,0.10),
      transparent 32%
    ),

    linear-gradient(
      135deg,
      #030107,
      #09040d
    );
}


/* =========================================================
   MAIN CONTAINER
   ========================================================= */

.app {

  width: 100%;
  height: 100%;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  padding: 20px;
}


/* =========================================================
   BOOK WRAPPER
   ========================================================= */

.book-wrap {

  width: min(1250px, 99vw);
  height: min(78vh, 760px);

  display: flex;

  align-items: center;
  justify-content: center;

  position: relative;
}


/* =========================================================
   BOOK
   ========================================================= */

.book {

  width: 100%;
  height: 100%;

  background: #ffffff;

  border-radius: 18px;

  overflow: hidden;

  box-shadow:
    var(--shadow-purple),
    0 20px 70px rgba(0,0,0,0.45);

  position: relative;
}


/* =========================================================
   PAGE
   ========================================================= */

.page-inner {

  width: 100%;
  height: 100%;

  padding: 1px;

  display: flex;

  align-items: center;
  justify-content: center;

  background: #ffffff;

  overflow: hidden;
}


/* =========================================================
   PDF CANVAS
   ========================================================= */

#pdfCanvas {

  display: block;

  max-width: 100%;
  max-height: 100%;

  background: #ffffff;
}


/* =========================================================
   LOADING
   ========================================================= */

#loading {

  position: absolute;

  inset: 0;

  display: flex;

  align-items: center;
  justify-content: center;

  background:
    rgba(10,5,20,0.25);

  color: #ffffff;

  font-size: 15px;

  z-index: 5;

  pointer-events: none;
}


/* =========================================================
   BOTTOM CONTROL PANEL
   ========================================================= */

.controls {

  width: min(1250px, 99vw);

  margin-top: 14px;

  padding: 10px 14px;

  display: flex;

  align-items: center;

  gap: 10px;

  border-radius: 16px;

  background: var(--glass);

  border: 1px solid var(--glass-border);

  backdrop-filter: blur(18px);

  -webkit-backdrop-filter: blur(18px);

  box-shadow:
    0 10px 35px rgba(0,0,0,0.22);
}


/* =========================================================
   BUTTONS
   ========================================================= */

.control-button {

  border: 1px solid var(--glass-border);

  background: rgba(255,255,255,0.07);

  color: var(--text-main);

  width: 42px;
  height: 38px;

  border-radius: 10px;

  cursor: pointer;

  font-size: 17px;

  transition:
    0.2s ease;
}


.control-button:hover {

  background: var(--purple);

  border-color: var(--purple-light);

  box-shadow:
    0 0 16px rgba(124,58,237,0.35);
}


.control-button:disabled {

  opacity: 0.35;

  cursor: default;

  box-shadow: none;
}


/* =========================================================
   PROGRESS SLIDER
   ========================================================= */

#progress {

  flex: 1;

  accent-color: var(--lime);

  cursor: pointer;
}


/* =========================================================
   PAGE COUNTER
   ========================================================= */

.page-counter {

  min-width: 65px;

  text-align: center;

  font-size: 14px;

  color: var(--text-secondary);

  direction: ltr;
}


/* =========================================================
   THEME BUTTON
   ========================================================= */

#themeButton {

  color: var(--lime);

  border-color:
    rgba(183,243,74,0.25);
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

  .app {

    padding: 10px;
  }

  .book-wrap {

    width: 100%;

    height: calc(100vh - 105px);
  }

  .book {

    border-radius: 12px;
  }

  .controls {

    width: 100%;

    padding: 8px;

    margin-top: 8px;

    gap: 6px;

    border-radius: 12px;
  }

  .control-button {

    width: 38px;
    height: 36px;

    font-size: 15px;
  }

  .page-counter {

    min-width: 55px;

    font-size: 12px;
  }
}

</style>

</head>


<body>

<div class="app">


  <!-- =====================================================
       BOOK
       ===================================================== -->

  <div class="book-wrap">

    <div class="book">

      <div class="page-inner" id="content">

        <canvas id="pdfCanvas"></canvas>

      </div>

      <div id="loading">
        در حال بارگذاری PDF...
      </div>

    </div>

  </div>


  <!-- =====================================================
       CONTROL PANEL
       ===================================================== -->

  <div class="controls">


    <!-- Previous -->
    <button
      class="control-button"
      id="prev"
      title="صفحه قبل"
    >
      ‹
    </button>


    <!-- Progress -->
    <input
      type="range"
      id="progress"
      min="1"
      max="1"
      value="1"
    >


    <!-- Next -->
    <button
      class="control-button"
      id="next"
      title="صفحه بعد"
    >
      ›
    </button>


    <!-- Page counter -->
    <div class="page-counter">

      <span id="current">
        1
      </span>

      /

      <span id="total">
        -
      </span>

    </div>


    <!-- Day / Night -->
    <button
      class="control-button"
      id="themeButton"
      title="حالت روز / شب"
    >
      ☀
    </button>

  </div>

</div>


<script>

/* =========================================================
   PDF SETTINGS
   ========================================================= */

/*
  فقط همین قسمت را برای انتخاب نسخه تغییر بده.

  PC:
  const BOOK_TYPE = "PC";

  Phone:
  const BOOK_TYPE = "PHONE";
*/

const BOOK_TYPE = "PC";


/* =========================================================
   PDF PATH
   ========================================================= */

const PDF_URL =
  BOOK_TYPE === "PHONE"

    ? "https://mohammabali126-hash.github.io/digital-book/ppt/Phone/phone.pdf"

    : "https://mohammabali126-hash.github.io/digital-book/ppt/PC/pc.pdf";


/* =========================================================
   PDF.JS WORKER
   ========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
   VARIABLES
   ========================================================= */

let pdfDocument = null;

let currentPage = 1;

/*
  این مقدار از خود PDF گرفته می‌شود.
  هیچ تعداد صفحه‌ای به صورت دستی وارد نشده است.
*/
let totalPages = 0;


/* =========================================================
   DOM ELEMENTS
   ========================================================= */

const canvas =
  document.getElementById("pdfCanvas");

const ctx =
  canvas.getContext("2d");

const content =
  document.getElementById("content");

const loading =
  document.getElementById("loading");

const prev =
  document.getElementById("prev");

const next =
  document.getElementById("next");

const progress =
  document.getElementById("progress");

const current =
  document.getElementById("current");

const total =
  document.getElementById("total");

const themeButton =
  document.getElementById("themeButton");


/* =========================================================
   LOAD PDF
   ========================================================= */

async function loadPDF() {

  try {

    loading.style.display = "flex";

    loading.textContent =
      "در حال بارگذاری PDF...";


    /*
      PDF را دریافت می‌کنیم.
    */

    pdfDocument =
      await pdfjsLib
        .getDocument(PDF_URL)
        .promise;


    /*
      تعداد صفحات مستقیماً
      از خود PDF خوانده می‌شود.
    */

    totalPages =
      pdfDocument.numPages;


    /*
      نمایش تعداد صفحات واقعی
      در پایین صفحه.
    */

    total.textContent =
      totalPages;


    /*
      تنظیم Slider بر اساس
      تعداد واقعی صفحات.
    */

    progress.min = 1;

    progress.max =
      totalPages;

    progress.value = 1;


    /*
      نمایش صفحه اول.
    */

    await showPage(1);

  }

  catch (error) {

    loading.style.display = "flex";

    loading.textContent =
      "خطا در بارگذاری PDF";

    console.error(error);

  }

}


/* =========================================================
   SHOW PAGE
   ========================================================= */

async function showPage(pageNumber) {

  if (!pdfDocument) {
    return;
  }


  /*
    جلوگیری از خارج شدن شماره صفحه
    از محدوده PDF.
  */

  if (pageNumber < 1) {

    pageNumber = 1;

  }


  if (pageNumber > totalPages) {

    pageNumber =
      totalPages;

  }


  currentPage =
    pageNumber;


  /*
    بروزرسانی اطلاعات پایین صفحه.
  */

  current.textContent =
    currentPage;

  progress.value =
    currentPage;


  /*
    فعال / غیرفعال کردن دکمه‌ها.
  */

  prev.disabled =
    currentPage === 1;

  next.disabled =
    currentPage === totalPages;


  /*
    نمایش Loading.
  */

  loading.style.display =
    "flex";

  loading.textContent =
    "در حال نمایش صفحه " +
    currentPage +
    "...";


  try {

    /*
      گرفتن صفحه واقعی PDF
    */

    const page =
      await pdfDocument.getPage(
        currentPage
      );


    /*
      اندازه اصلی صفحه
    */

    const baseViewport =
      page.getViewport({
        scale: 1
      });


    /*
      فضای قابل استفاده داخل قاب
    */

    const availableWidth =
      content.clientWidth - 2;

    const availableHeight =
      content.clientHeight - 2;


    /*
      محاسبه Scale برای
      قرار گرفتن کامل صفحه داخل قاب
    */

    const scaleX =
      availableWidth /
      baseViewport.width;

    const scaleY =
      availableHeight /
      baseViewport.height;


    const scale =
      Math.min(
        scaleX,
        scaleY
      );


    /*
      Viewport نهایی
    */

    const viewport =
      page.getViewport({
        scale: scale
      });


    /*
      کیفیت نمایش روی موبایل و
      نمایشگرهای High-DPI
    */

    const deviceScale =
      window.devicePixelRatio || 1;


    canvas.width =
      Math.floor(
        viewport.width *
        deviceScale
      );

    canvas.height =
      Math.floor(
        viewport.height *
        deviceScale
      );


    /*
      اندازه ظاهری Canvas
    */

    canvas.style.width =
      viewport.width + "px";

    canvas.style.height =
      viewport.height + "px";


    /*
      تنظیم Resolution
    */

    ctx.setTransform(
      deviceScale,
      0,
      0,
      deviceScale,
      0,
      0
    );


    /*
      Render صفحه PDF
    */

    await page.render({

      canvasContext: ctx,

      viewport: viewport

    }).promise;


    /*
      پایان Loading
    */

    loading.style.display =
      "none";

  }

  catch (error) {

    loading.style.display =
      "flex";

    loading.textContent =
      "خطا در نمایش صفحه";

    console.error(error);

  }

}


/* =========================================================
   PREVIOUS BUTTON
   ========================================================= */

prev.addEventListener(
  "click",
  function() {

    showPage(
      currentPage - 1
    );

  }
);


/* =========================================================
   NEXT BUTTON
   ========================================================= */

next.addEventListener(
  "click",
  function() {

    showPage(
      currentPage + 1
    );

  }
);


/* =========================================================
   SLIDER
   ========================================================= */

progress.addEventListener(
  "input",
  function() {

    showPage(
      Number(this.value)
    );

  }
);


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "ArrowLeft" ||
      event.key === "ArrowUp"
    ) {

      showPage(
        currentPage - 1
      );

    }


    if (
      event.key === "ArrowRight" ||
      event.key === "ArrowDown"
    ) {

      showPage(
        currentPage + 1
      );

    }

  }
);


/* =========================================================
   SWIPE
   ========================================================= */

let touchStartX = 0;


content.addEventListener(
  "touchstart",
  function(event) {

    touchStartX =
      event.changedTouches[0]
        .screenX;

  },
  {
    passive: true
  }
);


content.addEventListener(
  "touchend",
  function(event) {

    const touchEndX =
      event.changedTouches[0]
        .screenX;


    const difference =
      touchEndX -
      touchStartX;


    /*
      حرکت خیلی کوچک
      Swipe محسوب نمی‌شود.
    */

    if (
      Math.abs(difference) < 50
    ) {

      return;

    }


    /*
      Swipe به چپ
      صفحه بعد
    */

    if (difference < 0) {

      showPage(
        currentPage + 1
      );

    }


    /*
      Swipe به راست
      صفحه قبل
    */

    else {

      showPage(
        currentPage - 1
      );

    }

  },
  {
    passive: true
  }
);


/* =========================================================
   DAY / NIGHT
   ========================================================= */

let isLight = true;


themeButton.addEventListener(
  "click",
  function() {

    isLight =
      !isLight;


    document.body.classList.toggle(
      "light",
      isLight
    );


    themeButton.textContent =
      isLight
        ? "☀"
        : "🌙";

  }
);


/* =========================================================
   RESIZE
   ========================================================= */

let resizeTimer;


window.addEventListener(
  "resize",
  function() {

    clearTimeout(
      resizeTimer
    );


    resizeTimer =
      setTimeout(
        function() {

          showPage(
            currentPage
          );

        },
        200
      );

  }
);


/* =========================================================
   START
   ========================================================= */

loadPDF();

</script>

</body>
</html>
