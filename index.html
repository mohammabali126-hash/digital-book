<!DOCTYPE html>

<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Book</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    :root {
      --bg1: #17102f;
      --bg2: #24134b;
      --purple: #8b5cf6;
      --purple2: #6d28d9;
      --lime: #b7f34a;
      --text: #ffffff;
      --glass: rgba(255,255,255,0.08);
      --glass-border: rgba(255,255,255,0.14);
      --shadow: rgba(0,0,0,0.35);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(139,92,246,0.28), transparent 35%),
        radial-gradient(circle at 80% 90%, rgba(183,243,74,0.10), transparent 35%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text);
      overflow-x: hidden;
    }

    body.night {
      --bg1: #050309;
      --bg2: #10071f;
      --purple: #4c288e;
      --purple2: #32155f;
      --lime: #617c25;
      --glass: rgba(255,255,255,0.045);
      --glass-border: rgba(255,255,255,0.08);
      --shadow: rgba(0,0,0,0.65);

      background:
        radial-gradient(circle at 20% 10%, rgba(76,40,142,0.22), transparent 35%),
        radial-gradient(circle at 80% 90%, rgba(97,124,37,0.07), transparent 35%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .book-wrap {
      width: min(1250px, 99vw);
      height: min(78vh, 760px);
      min-height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .book {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow:
        0 25px 70px var(--shadow),
        0 0 0 1px rgba(255,255,255,0.12);
      position: relative;
    }

    .page-inner {
      width: 100%;
      height: 100%;
      padding: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
    }

    #pdfCanvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      background: white;
    }

    .loading {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(20,10,45,0.88);
      backdrop-filter: blur(8px);
      color: white;
      font-size: 18px;
    }

    .loading.hidden {
      display: none;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(255,255,255,0.25);
      border-top-color: var(--lime);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-left: 12px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .controls {
      width: min(1250px, 99vw);
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 16px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 15px 40px var(--shadow);
    }

    button {
      border: none;
      cursor: pointer;
      color: white;
      background: var(--purple2);
      border-radius: 10px;
      min-width: 42px;
      height: 40px;
      font-size: 18px;
      transition: 0.2s ease;
    }

    button:hover:not(:disabled) {
      background: var(--purple);
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .theme-btn {
      margin-right: auto;
      min-width: 42px;
    }

    .counter {
      min-width: 75px;
      text-align: center;
      font-size: 14px;
      white-space: nowrap;
    }

    #progress {
      flex: 1;
      accent-color: var(--lime);
      cursor: pointer;
    }

    @media (max-width: 700px) {
      .page {
        padding: 8px;
      }

      .book-wrap {
        width: 100%;
        height: calc(100vh - 115px);
        min-height: 300px;
      }

      .book {
        border-radius: 10px;
      }

      .controls {
        width: 100%;
        margin-top: 8px;
        padding: 8px;
        gap: 7px;
      }

      button {
        min-width: 38px;
        height: 36px;
      }

      .counter {
        min-width: 58px;
        font-size: 12px;
      }
    }
  </style>

</head>

<body>

  <main class="page">

```
<div class="book-wrap">
  <div class="book">

    <div class="page-inner">
      <canvas id="pdfCanvas"></canvas>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <span>در حال بارگذاری کتاب...</span>
    </div>

  </div>
</div>

<div class="controls">

  <button id="prevBtn" title="صفحه قبل">
    ‹
  </button>

  <input
    id="progress"
    type="range"
    min="1"
    max="1"
    value="1"
  >

  <div class="counter">
    <span id="current">1</span>
    /
    <span id="total">0</span>
  </div>

  <button id="nextBtn" title="صفحه بعد">
    ›
  </button>

  <button
    id="themeBtn"
    class="theme-btn"
    title="حالت شب / روز"
  >
    ☾
  </button>

</div>
```

  </main>

  <script>

    /*
      ==========================================
      نوع کتاب
      ==========================================

      PC:
      ppt/PC/pc.pdf

      PHONE:
      ppt/Phone/phone.pdf

      فقط همین مقدار را تغییر بده.
    */

    const BOOK_TYPE = "PC";


    /*
      ==========================================
      آدرس PDF
      ==========================================
    */

    const PDF_URL =
      BOOK_TYPE === "PHONE"
        ? "https://mohammabali126-hash.github.io/digital-book/ppt/Phone/phone.pdf"
        : "https://mohammabali126-hash.github.io/digital-book/ppt/PC/pc.pdf";


    /*
      ==========================================
      PDF.js
      ==========================================
    */

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


    /*
      ==========================================
      عناصر صفحه
      ==========================================
    */

    const canvas =
      document.getElementById("pdfCanvas");

    const ctx =
      canvas.getContext("2d");

    const loading =
      document.getElementById("loading");

    const progress =
      document.getElementById("progress");

    const current =
      document.getElementById("current");

    const total =
      document.getElementById("total");

    const prevBtn =
      document.getElementById("prevBtn");

    const nextBtn =
      document.getElementById("nextBtn");

    const themeBtn =
      document.getElementById("themeBtn");


    /*
      ==========================================
      وضعیت PDF
      ==========================================
    */

    let pdfDocument = null;

    let currentPage = 1;

    let totalPages = 0;

    let rendering = false;

    let pendingPage = null;


    /*
      ==========================================
      بارگذاری PDF
      ==========================================
    */

    async function loadPDF() {

      try {

        loading.classList.remove("hidden");

        pdfDocument =
          await pdfjsLib
            .getDocument(PDF_URL)
            .promise;

        /*
          تعداد صفحات کاملاً خودکار
          از خود PDF خوانده می‌شود.
        */

        totalPages =
          pdfDocument.numPages;

        total.textContent =
          totalPages;

        progress.min = 1;

        progress.max =
          totalPages;

        progress.value = 1;

        currentPage = 1;

        await showPage(1);

        loading.classList.add("hidden");

      } catch (error) {

        console.error(error);

        loading.innerHTML =
          "خطا در بارگذاری PDF";

      }

    }


    /*
      ==========================================
      نمایش صفحه
      ==========================================
    */

    async function showPage(pageNumber) {

      if (!pdfDocument) {
        return;
      }

      pageNumber =
        Math.max(
          1,
          Math.min(pageNumber, totalPages)
        );

      if (rendering) {

        pendingPage =
          pageNumber;

        return;

      }

      rendering = true;

      currentPage =
        pageNumber;

      current.textContent =
        currentPage;

      progress.value =
        currentPage;

      prevBtn.disabled =
        currentPage <= 1;

      nextBtn.disabled =
        currentPage >= totalPages;

      try {

        const page =
          await pdfDocument.getPage(currentPage);

        const container =
          document.querySelector(".page-inner");

        const availableWidth =
          container.clientWidth - 2;

        const availableHeight =
          container.clientHeight - 2;

        const viewport =
          page.getViewport({
            scale: 1
          });

        const scale =
          Math.min(
            availableWidth / viewport.width,
            availableHeight / viewport.height
          );

        const devicePixelRatio =
          window.devicePixelRatio || 1;

        const renderViewport =
          page.getViewport({
            scale:
              scale * devicePixelRatio
          });

        canvas.width =
          Math.floor(renderViewport.width);

        canvas.height =
          Math.floor(renderViewport.height);

        canvas.style.width =
          Math.floor(viewport.width * scale) + "px";

        canvas.style.height =
          Math.floor(viewport.height * scale) + "px";

        await page.render({
          canvasContext: ctx,
          viewport: renderViewport
        }).promise;

      } catch (error) {

        console.error(
          "Page render error:",
          error
        );

      } finally {

        rendering = false;

        if (pendingPage !== null) {

          const nextPage =
            pendingPage;

          pendingPage = null;

          showPage(nextPage);

        }

      }

    }


    /*
      ==========================================
      دکمه صفحه قبل
      ==========================================
    */

    prevBtn.addEventListener(
      "click",
      () => {

        if (currentPage > 1) {
          showPage(currentPage - 1);
        }

      }
    );


    /*
      ==========================================
      دکمه صفحه بعد
      ==========================================
    */

    nextBtn.addEventListener(
      "click",
      () => {

        if (currentPage < totalPages) {
          showPage(currentPage + 1);
        }

      }
    );


    /*
      ==========================================
      Slider
      ==========================================
    */

    progress.addEventListener(
      "input",
      () => {

        showPage(
          Number(progress.value)
        );

      }
    );


    /*
      ==========================================
      کیبورد
      ==========================================
    */

    document.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "ArrowLeft" ||
          event.key === "ArrowUp"
        ) {

          if (currentPage > 1) {
            showPage(currentPage - 1);
          }

        }

        if (
          event.key === "ArrowRight" ||
          event.key === "ArrowDown"
        ) {

          if (currentPage < totalPages) {
            showPage(currentPage + 1);
          }

        }

      }
    );


    /*
      ==========================================
      Swipe موبایل
      ==========================================
    */

    let touchStartX = 0;

    let touchEndX = 0;

    canvas.addEventListener(
      "touchstart",
      (event) => {

        touchStartX =
          event.changedTouches[0].screenX;

      },
      { passive: true }
    );

    canvas.addEventListener(
      "touchend",
      (event) => {

        touchEndX =
          event.changedTouches[0].screenX;

        const distance =
          touchEndX - touchStartX;

        if (Math.abs(distance) < 50) {
          return;
        }

        /*
          در حالت RTL:
          کشیدن به چپ = صفحه بعد
          کشیدن به راست = صفحه قبل
        */

        if (distance < 0) {

          if (currentPage < totalPages) {
            showPage(currentPage + 1);
          }

        } else {

          if (currentPage > 1) {
            showPage(currentPage - 1);
          }

        }

      },
      { passive: true }
    );


    /*
      ==========================================
      حالت شب / روز
      ==========================================
    */

    let isNight =
      localStorage.getItem("digitalBookNight") === "true";

    if (isNight) {

      document.body.classList.add("night");

      themeBtn.textContent = "☀";

    }


    themeBtn.addEventListener(
      "click",
      () => {

        isNight =
          !isNight;

        document.body.classList.toggle(
          "night",
          isNight
        );

        themeBtn.textContent =
          isNight ? "☀" : "☾";

        localStorage.setItem(
          "digitalBookNight",
          isNight
        );

      }
    );


    /*
      ==========================================
      تغییر اندازه پنجره
      ==========================================
    */

    let resizeTimer;

    window.addEventListener(
      "resize",
      () => {

        clearTimeout(resizeTimer);

        resizeTimer =
          setTimeout(
            () => {

              showPage(currentPage);

            },
            150
          );

      }
    );


    /*
      ==========================================
      شروع
      ==========================================
    */

    loadPDF();

  </script>

</body>
</html>
